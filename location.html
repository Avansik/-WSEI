    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

     
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background-color: lightgray;
        }

       
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: rgb(255, 59, 209);
        }

        .logo span {
            color: yellow; 
        }

      
        .menu {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 18px;
            background-color: lightgray;
        }

        .menu a {
            text-decoration: none;
            color: black;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: #ff007f; 
        }

        .contact-banner {
            background: #d0c000;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

 
        .map-section {
            position: relative;
            width: 100%;
            height: 400px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .phone {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    
        
        .contact-box {
    position: absolute;
    top: 125%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    text-align: left;
}

        .contact-box h2 {
            color: #d61a46;
            margin: 0;
            font-size: 20px;
        }
        .call-button {
    display: inline-block;
    padding: 10px 20px;
    font-size: 18px;
    color: rgb(0, 0, 0);
    text-decoration: none;
    background: #ffd700; 
    border-radius: 5px;
    transition: background 0.3s, color 0.3s;
}

.call-button:hover {
    background: #ff007f; 
    color: white; 
}

        .contact-box p {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>
