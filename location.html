<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freeze | Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    overflow-x:hidden;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 8%;

    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);

    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.logo{
    font-size:34px;
    font-weight:bold;
    color:#ff2db8;
}

.logo span{
    color:#ffee00;
}

.menu{
    display:flex;
    gap:30px;
}

.menu a{
    text-decoration:none;
    color:#444;
    font-size:18px;
    font-weight:600;
    position:relative;
    transition:0.3s;
}

.menu a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-6px;

    width:0%;
    height:2px;

    background:#ff2db8;
    transition:0.3s;
}

.menu a:hover{
    color:#ff2db8;
}

.menu a:hover::after{
    width:100%;
}

/* BANNER */

.contact-banner{
    height:250px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
    linear-gradient(135deg,#ff2db8,#ffee00);

    color:white;

    font-size:60px;
    font-weight:bold;
    letter-spacing:4px;
}

/* MAP SECTION */

.map-section{
    position:relative;
    width:100%;
    height:700px;
}

.map-section iframe{
    width:100%;
    height:100%;
    border:none;
    filter:grayscale(10%);
}

/* CONTACT CARD */

.contact-box{

    position:absolute;

    top:50%;
    left:10%;

    transform:translateY(-50%);

    width:420px;

    padding:40px;

    border-radius:25px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.3);

    box-shadow:0 10px 40px rgba(0,0,0,0.2);

    color:white;
}

.contact-box h2{
    font-size:28px;
    margin-bottom:20px;
    line-height:1.4;
}

.contact-box p{
    font-size:18px;
    line-height:1.7;
    margin-bottom:20px;
}

.phone{
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

/* BUTTON */

.call-button{

    display:inline-block;

    padding:15px 30px;

    background:#ffee00;

    color:#000;

    font-size:18px;
    font-weight:bold;

    border-radius:50px;

    text-decoration:none;

    transition:0.3s;
}

.call-button:hover{
    background:#ff2db8;
    color:white;

    transform:translateY(-5px);

    box-shadow:0 10px 20px rgba(255,45,184,0.4);
}

/* EXTRA INFO */

.info{
    margin-top:25px;
    padding-top:20px;

    border-top:1px solid rgba(255,255,255,0.3);
}

.info div{
    margin-bottom:12px;
    font-size:16px;
}

/* RESPONSIVE */

@media(max-width:900px){

    .contact-box{
        width:90%;
        left:50%;
        top:70%;
        transform:translate(-50%,-50%);
    }

    .contact-banner{
        font-size:40px;
    }

    .map-section{
        height:900px;
    }
}

@media(max-width:600px){

    .header{
        flex-direction:column;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .contact-box{
        padding:30px 20px;
    }

    .contact-box h2{
        font-size:22px;
    }

    .phone{
        font-size:24px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">

    <nav class="menu">
        <a href="index.html">Home</a>

        <a href="contact.html">Contact</a>
    </nav>

</body>
</html>
