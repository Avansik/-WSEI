\<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freeze | Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    overflow-x:hidden;
}

/* HEADER */

.header{

    background:
    linear-gradient(135deg,#ff2db8,#ffe600);

    padding:60px 20px;

    text-align:center;

    color:white;

    font-size:60px;
    font-weight:bold;
    letter-spacing:5px;

    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* MENU */

.menu{

    display:flex;
    justify-content:center;
    gap:40px;

    background:white;

    padding:20px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.menu a{

    text-decoration:none;
    color:#555;

    font-size:18px;
    font-weight:bold;

    position:relative;

    transition:0.3s;
}

.menu a::after{

    content:'';

    position:absolute;
    left:0;
    bottom:-5px;

    width:0%;
    height:2px;

    background:#ff2db8;

    transition:0.3s;
}

.menu a:hover{
    color:#ff2db8;
}

.menu a:hover::after{
    width:100%;
}

/* MAIN SECTION */

.contact-wrapper{

    display:flex;
    gap:40px;

    width:90%;
    max-width:1400px;

    margin:60px auto;

    align-items:stretch;
}

/* MAP */

.map-container{

    flex:1;

    overflow:hidden;

    border-radius:30px;

    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.map-container iframe{
    width:100%;
    height:100%;
    min-height:700px;
    border:none;
}

/* CONTACT FORM */

.container{

    flex:1;

    padding:50px;

    border-radius:30px;

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(15px);

    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.container h2{

    color:#ff2db8;

    font-size:42px;

    margin-bottom:35px;
}

form{
    display:flex;
    flex-direction:column;
}

label{

    margin-top:18px;
    margin-bottom:8px;

    font-weight:bold;

    color:#444;
}

input,
textarea{

    padding:16px;

    border:none;

    border-radius:15px;

    background:#f1f1f1;

    font-size:16px;

    transition:0.3s;
}

input:focus,
textarea:focus{

    outline:none;

    background:white;

    box-shadow:0 0 0 3px rgba(255,45,184,0.25);
}

textarea{
    resize:none;
}

/* BUTTON */

button{

    margin-top:30px;

    padding:18px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(135deg,#ff2db8,#ff69d4);

    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:translateY(-5px);

    box-shadow:0 10px 25px rgba(255,45,184,0.4);
}

/* CONTACT INFO */

.contact-info{

    margin-top:40px;

    padding-top:30px;

    border-top:1px solid #ddd;
}

.contact-info div{

    margin-bottom:15px;

    font-size:17px;

    color:#555;
}

/* SOCIAL */

.social-icons{

    margin-top:35px;

    display:flex;
    gap:20px;
}

.social-icons a{

    width:55px;
    height:55px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:white;

    box-shadow:0 5px 15px rgba(0,0,0,0.08);

    transition:0.3s;
}

.social-icons a:hover{

    transform:translateY(-8px) scale(1.08);

    background:#ff2db8;
}

.social-icons img{
    width:24px;
}

/* RESPONSIVE */

@media(max-width:1100px){

    .contact-wrapper{
        flex-direction:column;
    }

    .map-container iframe{
        min-height:500px;
    }
}

@media(max-width:700px){

    .header{
        font-size:42px;
        padding:45px 20px;
    }

    .menu{
        flex-wrap:wrap;
        gap:20px;
    }

    .container{
        padding:30px 20px;
    }

    .container h2{
        font-size:32px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">
    CONTACT
</header>

<!-- MENU -->

<nav class="menu">

    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>

</nav>

<!-- MAIN -->

<section class="contact-wrapper">

    <!-- MAP -->

    <div class="map-container">

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509445!2d144.96305791531876!3d-37.8162797797519!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0x5045675218ce6e0!2sMelbourne%2C%20VIC%2C%20Australia!5e0!3m2!1sen!2sus!4v1616638490885!5m2!1sen!2sus"
            allowfullscreen=""
            loading="lazy">
        </iframe>

    </div>

    <!-- FORM -->

    <div class="container">

        <h2>Inquiry Form</h2>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Your name">

            <label>Email</label>
            <input type="email" placeholder="Your email">

            <label>Subject</label>
            <input type="text" placeholder="Subject">

            <label>Share your thoughts</label>
            <textarea rows="6" placeholder="Write your message..."></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <!-- INFO -->

        <div class="contact-info">

            <div>📍 Melbourne, Australia</div>

            <div>📞 +38 (067) 123-45-67</div>

            <div>📧 freeze@yogurt.com</div>

            <div>🕒 Mon - Sun: 09:00 - 22:00</div>

        </div>

        <!-- SOCIAL -->

        <div class="social-icons">

            <a href="https://facebook.com">
                <img src="./fb.png" alt="">
            </a>

            <a href="https://instagram.com">
                <img src="./insta.png" alt="">
            </a>

            <a href="https://twitter.com">
                <img src="./twiter.png" alt="">
            </a>

            <a href="https://youtube.com">
                <img src="./youtube.png" alt="">
            </a>

        </div>

    </div>

</section>

</body>
</html>
