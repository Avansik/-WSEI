<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        .header {
            background-color: #d1c200;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .menu {
            display: flex;
            justify-content: center;
            background-color: #d3d0d0;
            padding: 15px 0;
        }

        .menu a {
            color: #555; 
            text-decoration: none;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .menu a:hover {
            color: #ff69b4; 
        }

        .container {
            width: 60%;
            margin: 30px auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #d10050;
            text-transform: uppercase;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background-color: #d10050;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #b00040;
        }

        .map-container {
            width: 60%;
            margin: 30px auto;
        }

        .social-icons {
            text-align: center;
            margin-top: 20px;
            background: #d10050;
            padding: 10px 0;
        }

        .social-icons a img {
            width: 30px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="header">CONTACT</div>
    <nav class="menu">
        <a href="D:\html\Kursova.html">Home</a>
        <a href="about.html">About</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="map-container">
        <iframe 
            width="100%" 
            height="400" 
            frameborder="0" 
            style="border:0" 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509445!2d144.96305791531876!3d-37.8162797797519!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0x5045675218ce6e0!2sMelbourne%2C%20VIC%2C%20Australia!5e0!3m2!1sen!2sus!4v1616638490885!5m2!1sen!2sus" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>

    <div class="container">
        <h2>Inquiry Form</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject">
            <label for="message">Share your thoughts:</label>
            <textarea id="message" name="message" rows="5"></textarea>
            <button type="submit">Send</button>
        </form>
    </div>

    <div class="social-icons">
        <a href="https://www.facebook.com"><img src="D:\html\Kursova\fb.png" alt="Facebook"></a>
        <a href="https://www.instagram.com"><img src="D:\html\Kursova\insta.png" alt="Instagram"></a>
        <a href="https://www.twitter.com"><img src="D:\html\Kursova\twiter.png" alt="Twitter"></a>
        <a href="https://www.youtube.com"><img src="D:\html\Kursova\youtube.png" alt="You Tube"></a>
    </div>
</body>
</html>
